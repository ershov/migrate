# Shared settings, sourced by every script. Put overrides in conf/kit.local.conf (untracked).
CONF=$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)
REPO=$(dirname "$CONF")
BIN=$REPO/bin

OLD_HOST=CHANGE-ME.local          # old Mac's address; written by 110-OLD-prepare.sh (name.local or 169.254.x.x)
OLD_UUID=                         # old Mac's hardware UUID; written by 110-OLD-prepare.sh
OLD_USER=$(id -un)
REDACT=                           # extended regex blanked out of the generated part of LOCAL.md
DATA=$HOME/migrate                # runtime data: state/, stage/, backup-*/
RSYNC=/opt/homebrew/bin/rsync     # GNU rsync 3.x, needed on both Macs

[ -f "$CONF/kit.local.conf" ] && . "$CONF/kit.local.conf"

STATE=$DATA/state
STAGE=$DATA/stage
SSH="ssh -o ControlMaster=auto -o ControlPath=$HOME/.ssh/cm-%C -o ControlPersist=8h -o ServerAliveInterval=30"
RSYNC_OPTS="-aHXN --filter=-x_com.apple.macl --partial --human-readable --info=progress2,stats1"

need_old_host() {
  [ "$OLD_HOST" != CHANGE-ME.local ] || { echo "set OLD_HOST in $CONF/kit.local.conf"; exit 1; }
}
